name: CI - Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_MOCK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Router Tests
        run: python tests/test_router.py

      - name: Run Intent Classifier Tests
        run: python tests/test_intent_classifier.py

      - name: Run Grounding Tests (Gunjan (Person 2))
        run: python -m pytest tests/test_grounding.py -v

      - name: Run Resilience Tests
        run: python tests/test_resilience.py

      - name: Run Full Pipeline Demo (all 7 scenarios)
        run: python -m src.main
